name: Testar inicializacao do backend

on:
  push:
    branches:
      - fix/inicializacao-backend
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar e verificar o contexto Spring
        run: bash ./gradlew clean test --no-daemon
